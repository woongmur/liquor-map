<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 술 지도 — 프로토타입</title>
<!--
  플로우 확인용 프로토타입. 프로덕션 코드가 아니다.

  - 데이터는 아래 DATA 상수에 인라인돼 있다. 더블클릭으로 바로 열리게 하려는 것이며,
    실제 원본은 ../data/drinks.sample.json 이다. 구현 시에는 fetch + 캐시 구조로 바꾼다.
  - 지도 토폴로지를 CDN에서 받아온다. 프로덕션에서는 반드시 앱에 내장할 것.
  - 이 파일이 보여주려는 것은 두 가지다:
      1) ID 참조 스키마에서 화면을 그리는 해석 로직 (resolveCountriesForCategory 등)
      2) 지도 → 술 상세 → 칵테일 상세로 이어지는 화면 전환 흐름
-->
<style>
  :root {
    --bg: #ffffff; --surface: #f7f6f3; --border: #e3e1dc;
    --text: #1a1a19; --text-sub: #6b6a65; --text-mute: #98968f;
    --warn-bg: #fdf3dc; --warn-text: #8a5a00; --warn-border: #e8c987;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    max-width: 720px; margin-inline: auto; line-height: 1.6;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  button {
    font: inherit; background: transparent; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 14px; cursor: pointer; color: var(--text);
  }
  button:hover { background: var(--surface); }
  button.active { background: #e8eef7; border-color: #9bb8dd; color: #17436f; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .label { font-size: 13px; font-weight: 500; color: var(--text-sub); margin: 0 0 4px; }
  .body { font-size: 14px; margin: 0 0 14px; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
  }
  .row.clickable { cursor: pointer; }
  .row.clickable:hover { background: var(--surface); }
  .row.best { background: var(--warn-bg); border-color: var(--warn-border); }
  .hint { font-size: 12px; color: var(--text-sub); margin: 2px 0 0; }
  .muted { font-size: 12px; color: var(--text-mute); }
  .badge {
    display: inline-block; background: var(--warn-bg); color: var(--warn-text);
    border: 1px solid var(--warn-border); font-size: 12px; padding: 3px 10px; border-radius: var(--radius);
  }
  .swatch { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .back { margin-bottom: 12px; }
  .hidden { display: none; }
  path.country { fill: var(--surface); stroke: var(--border); stroke-width: 0.5; }
  path.country.active { cursor: pointer; }
</style>
</head>
<body>

<h1>세계 술 지도 — 프로토타입</h1>

<section id="screen-map">
  <div class="tabs" id="tabs"></div>
  <p class="muted" id="map-status">지도를 불러오는 중</p>
  <div id="map"></div>
  <p class="muted" style="text-align:center">색칠된 국가를 눌러보세요</p>
</section>

<section id="screen-picker" class="hidden">
  <button class="back" onclick="go('map')">← 지도로</button>
  <p class="label" id="picker-title"></p>
  <div id="picker-list"></div>
</section>

<section id="screen-drink" class="hidden">
  <button class="back" onclick="backFromDrink()">← 뒤로</button>
  <div class="card">
    <div class="swatch" id="drink-swatch" style="width:56px;height:56px;margin:0 auto 12px"></div>
    <p class="muted" id="drink-meta" style="text-align:center;margin:0 0 2px"></p>
    <p style="font-size:18px;font-weight:500;text-align:center;margin:0 0 16px" id="drink-name"></p>
    <p class="label">역사</p><p class="body" id="drink-history"></p>
    <p class="label">맛</p><p class="body" id="drink-taste"></p>
    <p class="label">향</p><p class="body" id="drink-aroma"></p>
    <p class="label">초보자 팁</p><p class="body" id="drink-tip" style="margin-bottom:0"></p>
  </div>
  <p class="label" style="margin-top:20px">구매할 수 있는 앱</p>
  <div id="drink-retailers"></div>
  <p class="label" style="margin-top:20px">이 술로 만드는 칵테일</p>
  <div id="drink-cocktails"></div>
</section>

<section id="screen-cocktail" class="hidden">
  <button class="back" onclick="go('drink')">← 칵테일 목록으로</button>
  <div class="card">
    <div class="swatch" id="cocktail-swatch" style="width:56px;height:56px;margin:0 auto 12px"></div>
    <p style="text-align:center;margin:0 0 8px" id="cocktail-badge-wrap"></p>
    <p style="font-size:18px;font-weight:500;text-align:center;margin:0 0 16px" id="cocktail-name"></p>
    <p class="label">레시피</p><p class="body" id="cocktail-recipe"></p>
    <p class="label">맛</p><p class="body" id="cocktail-taste" style="margin-bottom:0"></p>
  </div>
  <p class="muted" id="cocktail-unverified" style="margin-top:12px"></p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

    { id:"makgeolli-ginger", name:"막걸리 진저에일", hint:"알싸한 생강향", recipe:"막걸리 150ml에 진저에일 100ml를 섞어요.", taste:"생강의 알싸함이 막걸리의 구수함과 재미있게 어우러져요.", recipeVerified:false },
    { id:"margarita", name:"마가리타", hint:"데킬라 칵테일의 정석", recipe:"데킬라 45ml, 트리플섹 20ml, 라임즙 20ml를 흔들어 소금 리밍한 잔에 따라요.", taste:"새콤한 라임과 짭짤한 소금이 데킬라의 화한 맛을 잘 잡아줘요.", recipeVerified:false },
    { id:"tequila-sunrise", name:"데킬라 선라이즈", hint:"일출을 닮은 그라데이션 칵테일", recipe:"데킬라 45ml에 오렌지주스를 채우고 그레나딘 시럽 10ml를 천천히 부어요.", taste:"달콤한 오렌지향 뒤로 데킬라의 알싸함이 느껴져요.", recipeVerified:false },
    { id:"paloma", name:"팔로마", hint:"자몽 탄산의 상큼함", recipe:"데킬라 45ml에 자몽 탄산음료 100ml와 라임즙을 더해요.", taste:"쌉쌀한 자몽향과 탄산이 데킬라와 잘 어울려요.", recipeVerified:false },
    { id:"tequila-slammer", name:"테킬라 슬래머", hint:"스파클링과 함께 원샷", recipe:"데킬라 30ml에 스프라이트 30ml를 섞고 잔을 덮어 살짝 친 뒤 거품이 날 때 원샷해요.", taste:"톡 쏘는 탄산과 함께 데킬라 향이 확 퍼져요.", recipeVerified:false }
  ]
};

const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
const CAT = byId(DATA.categories);
const COUNTRY = byId(DATA.countries);
const DRINK = byId(DATA.drinks);
const COCKTAIL = byId(DATA.cocktails);

let selectedCategory = null;
let currentDrink = null;
let cameFrom = 'map';

// 스키마 해석 로직 — 구현 시 이 부분을 참고할 것

function drinksForCategory(catId) {
  if (!catId) return DATA.drinks;
  return DATA.drinks.filter(d => d.categoryIds.includes(catId));
}

function countryColorMap(catId) {
  // 국가 isoNumeric -> 칠할 색. 한 국가에 여러 술이 걸리면 첫 카테고리 색을 쓴다.
  const map = {};
  drinksForCategory(catId).forEach(d => {
    const color = CAT[d.categoryIds[0]].mapColor;
    d.countryIds.forEach(cid => {
      const c = COUNTRY[cid];
      if (c && !(c.isoNumeric in map)) map[c.isoNumeric] = color;
    });
  });
  return map;
}

function drinksInCountry(countryId, catId) {
  return drinksForCategory(catId).filter(d => d.countryIds.includes(countryId));
}

// 화면 전환

function go(screen) {
  ['map','picker','drink','cocktail'].forEach(s =>
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== screen));
  window.scrollTo(0, 0);
}

function backFromDrink() { go(cameFrom); }

// 렌더링

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const all = document.createElement('button');
  all.textContent = '전체';
  all.onclick = () => selectCategory(null);
  all.dataset.cat = '';
  tabs.appendChild(all);
  [...DATA.categories].sort((a,b) => (a.sortOrder||0)-(b.sortOrder||0)).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.name;
    b.dataset.cat = c.id;
    b.onclick = () => selectCategory(c.id);
    tabs.appendChild(b);
  });
}

function selectCategory(catId) {
  selectedCategory = catId;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.cat === (catId || '')));
  paintMap();
}

function paintMap() {
  const colors = countryColorMap(selectedCategory);
  document.querySelectorAll('path.country').forEach(p => {
    const iso = Number(p.dataset.iso);
    const color = colors[iso];
    p.style.fill = color || '';
    p.classList.toggle('active', Boolean(color));
  });
}

function onCountryClick(isoNumeric) {
  const country = DATA.countries.find(c => c.isoNumeric === isoNumeric);
  if (!country) return;
  const list = drinksInCountry(country.id, selectedCategory);
  if (list.length === 0) return;
  if (list.length === 1) { cameFrom = 'map'; showDrink(list[0].id); return; }

  // 한 국가에 술이 여러 개면 선택 목록을 먼저 보여준다
  cameFrom = 'picker';
  document.getElementById('picker-title').textContent = country.name + '의 술';
  const wrap = document.getElementById('picker-list');
  wrap.innerHTML = '';
  list.forEach(d => {
    const row = document.createElement('div');
    row.className = 'row clickable';
    row.onclick = () => showDrink(d.id);
    row.innerHTML = `<div class="swatch" style="background:${CAT[d.categoryIds[0]].mapColor}"></div>
      <div style="flex:1"><div style="font-weight:500;font-size:14px">${d.name}</div>
      <p class="hint">${CAT[d.categoryIds[0]].name} · ${d.abv || ''}</p></div><span class="muted">›</span>`;
    wrap.appendChild(row);
  });
  go('picker');
}

function showDrink(drinkId) {
  const d = DRINK[drinkId];
  currentDrink = d;
  const color = CAT[d.categoryIds[0]].mapColor;
  const countryNames = d.countryIds.map(c => COUNTRY[c].name).join(', ');

  document.getElementById('drink-swatch').style.background = color;
  document.getElementById('drink-meta').textContent =
    `${countryNames} · ${d.categoryIds.map(c => CAT[c].name).join(', ')}${d.abv ? ' · ' + d.abv : ''}`;
  document.getElementById('drink-name').textContent = d.name;
  document.getElementById('drink-history').textContent = d.history;
  document.getElementById('drink-taste').textContent = d.taste;
  document.getElementById('drink-aroma').textContent = d.aroma;
  document.getElementById('drink-tip').textContent = d.beginnerTip;

  const rWrap = document.getElementById('drink-retailers');
  rWrap.innerHTML = '';
  (d.retailers || []).forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span style="font-size:14px">${r.name}</span>`;
    rWrap.appendChild(row);
  });

  const cWrap = document.getElementById('drink-cocktails');
  cWrap.innerHTML = '';
  (d.cocktailIds || []).forEach((cid, i) => {
    const c = COCKTAIL[cid];
    if (!c) return;
    const isBest = i === 0;  // 배열 첫 항목이 추천
    const row = document.createElement('div');
    row.className = 'row clickable' + (isBest ? ' best' : '');
    row.onclick = () => showCocktail(cid);
    row.innerHTML = `<div class="swatch" style="background:${isBest ? '#E8B33C' : color}"></div>
      <div style="flex:1"><div style="font-weight:500;font-size:14px">${c.name}${isBest ? ' ★' : ''}</div>
      <p class="hint">${c.hint}</p></div><span class="muted">›</span>`;
    cWrap.appendChild(row);
  });

  go('drink');
}

function showCocktail(cocktailId) {
  const c = COCKTAIL[cocktailId];
  const isBest = currentDrink.cocktailIds[0] === cocktailId;
  document.getElementById('cocktail-swatch').style.background =
    isBest ? '#E8B33C' : CAT[currentDrink.categoryIds[0]].mapColor;
  document.getElementById('cocktail-badge-wrap').innerHTML =
    isBest ? '<span class="badge">★ 베스트 추천</span>' : '';
  document.getElementById('cocktail-name').textContent = c.name;
  document.getElementById('cocktail-recipe').textContent = c.recipe;
  document.getElementById('cocktail-taste').textContent = c.taste;
  document.getElementById('cocktail-unverified').textContent =
    c.recipeVerified ? '' : '이 레시피는 아직 검증 전이에요.';
  go('cocktail');
}

// 지도 — 프로덕션에서는 토폴로지를 앱에 내장할 것

renderTabs();
selectCategory(null);

const svg = d3.select('#map').append('svg')
  .attr('viewBox', '0 0 640 340').style('width', '100%').style('height', 'auto');

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
  const features = topojson.feature(world, world.objects.countries).features;
  const projection = d3.geoNaturalEarth1()
    .fitSize([640, 340], { type: 'FeatureCollection', features });
  const path = d3.geoPath(projection);

  svg.selectAll('path').data(features).enter().append('path')
    .attr('d', path)
    .attr('class', 'country')
    .attr('data-iso', d => d.id)
    .on('click', (_, d) => onCountryClick(Number(d.id)));

  document.getElementById('map-status').classList.add('hidden');
  paintMap();
}).catch(() => {
  document.getElementById('map-status').textContent = '지도를 불러오지 못했어요.';
});
</script>
</body>
</html>
